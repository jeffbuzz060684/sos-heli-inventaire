  return (+p[2]) + " " + m[+p[1]] + " " + p[0];
}

/* ---------------- calcul (formules de l'Excel : O=SUM(E:N), P=O-D) ---------------- */
function reelOf(it){
  var s = 0;
  (it.loc || []).forEach(function(x){ if(x) s += x; });
  return s;
}
function ecartOf(it){ return reelOf(it) - (it.d || 0); }
var STATUTS = {
  manque:{ e:"🔴", label:"En manque (réel < chargé)" },
  exces:{ e:"🔵", label:"En excès (réel > chargé)" },
  conforme:{ e:"🟢", label:"Conforme (écart nul)" },
  nv:{ e:"⚪", label:"Non vérifié (pas de date de contrôle)" }
};
function statutOf(it){
  if(!it.dc) return "nv";
  var ec = ecartOf(it);
  if(ec < 0) return "manque";
  if(ec > 0) return "exces";
  return "conforme";
}
function isAlert(it){
  if(!it.dc) return true;
  return ecartOf(it) !== 0;
}
function ecHtml(it){
  var ec = ecartOf(it);
  var cls = ec < 0 ? "neg" : (ec > 0 ? "pos" : "zero");
  var t = ec > 0 ? "+" + ec : (ec < 0 ? "−" + (-ec) : "✓ 0");
  return '<span class="ec ' + cls + '">' + t + "</span>";
}
function locSummary(it){
  var out = [];
  (it.loc || []).forEach(function(x, i){ if(x) out.push(LOCS[i].s + "×" + x); });
  return out.join(" · ");
}

/* ---------------- persistance + fusion ---------------- */
var _shadow = {};
function sig(it){ return JSON.stringify([it.sec,it.nno,it.lib,it.d,it.loc,it.dc,it.obs,JSON.stringify(it.hist||[])]); }
function primeShadow(){ _shadow = {}; state.items.forEach(function(it){ _shadow[it.id] = sig(it); }); }
function stampUpdates(){ state.items.forEach(function(it){ if(_shadow[it.id] !== sig(it)) it.u = Date.now(); }); }
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast("⚠️ Stockage plein — fais un export fichier immédiatement"); }
}
var _dirty = false, _saveSeq = 0, driveTimer = null, driveSending = false, driveSendingAt = 0;
function save(){
  stampUpdates(); primeShadow(); persist();
  _dirty = true; _saveSeq++;
  if(state.cfg.driveAuto) scheduleDriveBackup();
}
function scheduleDriveBackup(){
  if(driveTimer) clearTimeout(driveTimer);
  driveTimer = setTimeout(function(){ driveTimer = null; driveSend(false); }, 30000);
}
function pruneTombs(){
  var cutoff = Date.now() - 180*86400000;
  Object.keys(state.tombs).forEach(function(id){ if(state.tombs[id] < cutoff) delete state.tombs[id]; });
}
function mergeRemote(remote){
  var added=0, changed=0, removed=0;
  if(!remote || !Array.isArray(remote.items)) return { added:0, changed:0, removed:0 };
  var byId = {}; state.items.forEach(function(it){ byId[it.id] = it; });
  remote.items.forEach(function(rit){
    if(!Array.isArray(rit.loc)) rit.loc = [];
    while(rit.loc.length < LOCS.length) rit.loc.push(null);
    if(!rit.hist) rit.hist = [];
    var lit = byId[rit.id];
    if(!lit){ if(!state.tombs[rit.id] || (rit.u||0) > state.tombs[rit.id]){ state.items.push(rit); added++; } return; }
    if((rit.u||0) > (lit.u||0)){ lit.sec=rit.sec; lit.nno=rit.nno; lit.lib=rit.lib; lit.d=rit.d; lit.loc=rit.loc; lit.dc=rit.dc; lit.obs=rit.obs; lit.hist=rit.hist||[]; lit.u=rit.u; changed++; }
  });
  var rtombs = remote.tombs || {};
  state.items = state.items.filter(function(it){
    if(rtombs[it.id] && rtombs[it.id] > (it.u||0)){ removed++; return false; }
    return true;
  });
  Object.keys(rtombs).forEach(function(id){ if(rtombs[id] > (state.tombs[id]||0)) state.tombs[id] = rtombs[id]; });
  mergeLogs(remote ? remote.log : []);
  pruneTombs();
  return { added:added, changed:changed, removed:removed };
}

/* ---------------- journal des modifications ---------------- */
var LOG_CAP = 500;
var ACT_E = { verif:"✅", edit:"✏️", ajout:"➕", suppression:"🗑️", annulation:"↩️", import:"📥" };
var ACT_L = { verif:"Vérification", edit:"Modification", ajout:"Ajout", suppression:"Suppression", annulation:"Annulation", import:"Import" };
function logAdd(act, it, chg, note){
  state.log.unshift({ t:Date.now(), id:it?it.id:null, nno:it?it.nno:"", sec:it?it.sec:"", lib:it?it.lib:"", act:act, chg:chg||[], n:note||null });
  if(state.log.length > LOG_CAP) state.log.length = LOG_CAP;
}
function logKey(e){ return e.t + "|" + e.id + "|" + e.act + "|" + (e.chg && e.chg.length ? JSON.stringify(e.chg[0]) : ""); }
function mergeLogs(remote){
  var seen = {}, out = [];
  state.log.concat(remote || []).forEach(function(e){ var k = logKey(e); if(!seen[k]){ seen[k] = 1; out.push(e); } });
  out.sort(function(a,b){ return b.t - a.t; });
  if(out.length > LOG_CAP) out.length = LOG_CAP;
  state.log = out;
}
function fmtDT(ts){
  var d = new Date(ts);
  return d.getDate() + "/" + (d.getMonth()+1) + " " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

    if((it.nno||"") !== (f.nno||"")) chg.push(["Réf NNO/MAT", it.nno||"—", f.nno||"—"]);
    if(it.lib !== f.lib) chg.push(["Libellé", it.lib, f.lib]);
    if((it.d==null?null:it.d) !== f.d) chg.push(["Total chargé", it.d==null?"—":it.d, f.d==null?"—":f.d]);
    chg = chg.concat(locDiff(it.loc, f.loc));
    if((it.dc||"") !== (f.dc||"")) chg.push(["Date contrôle", it.dc||"—", f.dc||"—"]);
    if((it.obs||"") !== (f.obs||"")) chg.push(["Observation", it.obs||"—", f.obs||"—"]);
    it.sec=f.sec; it.nno=f.nno; it.lib=f.lib; it.d=f.d; it.loc=f.loc; it.dc=f.dc; it.obs=f.obs;
    if(chg.length) logAdd("edit", it, chg);
  } else {
    var nit = { id:uid(), sec:f.sec, nno:f.nno, lib:f.lib, d:f.d, loc:f.loc, dc:f.dc, obs:f.obs, hist:[], u:Date.now() };
    state.items.push(nit);
    logAdd("ajout", nit, [["Libellé", "(nouveau)", f.lib], ["Section", "—", f.sec], ["Total chargé", "—", f.d==null?"—":f.d]]);
  }
  save(); renderAll(); closeSheet();
  toast("💾 Référence enregistrée");
}
function renderHist(it){
  var h = (it && it.hist && it.hist.length) ? it.hist.slice().reverse() : [];
  E("histBox").innerHTML = h.length ? "<b style='font-size:13px'>🕘 Historique des vérifications</b>" + h.map(function(e){
    return '<div class="hist">✔ ' + fmtDate(e.d) + (e.n ? " — " + esc(e.n) : "") + "</div>";
  }).join("") : "";
}
function doVerif(){
  var it = getIt(openId); if(!it) return;
  var d = E("ctlDate").value || today();
  var n = E("ctlNote").value.trim();
  _undo = { type:"verif", id:it.id, dc:it.dc, hist:JSON.parse(JSON.stringify(it.hist||[])) };
  logAdd("verif", it, [["Date contrôle", it.dc || "—", d]], n || null);
  it.dc = d;
  if(!it.hist) it.hist = [];
  it.hist.push({ d:d, n:n });
  toast("✅ Vérification du " + fmtDate(d) + " enregistrée", "Annuler", undoLast);
  save(); renderAll(); openItem(it.id); E("ctlDate").value = today(); E("ctlNote").value = "";
}
function quickVerif(id){
  var it = getIt(id); if(!it) return;
  _undo = { type:"verif", id:it.id, dc:it.dc, hist:JSON.parse(JSON.stringify(it.hist||[])) };
  logAdd("verif", it, [["Date contrôle", it.dc || "—", today()]], "Vérification enregistrée en un geste");
  it.dc = today();
  if(!it.hist) it.hist = [];
  it.hist.push({ d:today(), n:"" });
  save(); renderAll();
  toast("✅ " + it.lib + " vérifié aujourd'hui", "Annuler", undoLast);
}
function deleteItem(){
  var it = getIt(openId); if(!it) return;
  if(!window.confirm("Supprimer « " + (it.lib||"") + " » ?")) return;
  logAdd("suppression", it, [["Libellé", it.lib, "SUPPRIMÉ"], ["Total chargé", it.d==null?"—":it.d, "—"]]);
  state.tombs[it.id] = Date.now();
  state.items = state.items.filter(function(x){ return x.id !== it.id; });
  _undo = { type:"del", item:JSON.parse(JSON.stringify(it)) };
  save(); renderAll(); closeSheet();
  toast("🗑️ Référence supprimée", "Annuler", undoLast);
}

/* ---------------- export / import ---------------- */
function exportData(){ return JSON.stringify({ v:1, app:"sos-heli-inventaire", exported:new Date().toISOString(), items:state.items, tombs:state.tombs, log:state.log }); }
function download(name, content, mime){
  var blob = (content instanceof Blob) ? content : new Blob([content], { type: mime || "application/octet-stream" });
  try{
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); try{ document.body.removeChild(a); }catch(e){} }, 800);
  }catch(e){ toast("⚠️ Téléchargement impossible : " + (e && e.message ? e.message : e)); }
  /* PWA installée : si le téléchargement reste invisible, proposer le partage Android */
  try{
    var standalone = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches;
    if(standalone && navigator.share && navigator.canShare){
      var f = new File([blob], name, { type: blob.type || "application/octet-stream" });
      if(navigator.canShare({ files: [f] }))
        toast("📄 Si le fichier n'apparaît pas dans Téléchargements :", "📤 Enregistrer via Partage", function(){
          navigator.share({ files: [f], title: name }).catch(function(){});
        });
    }
  }catch(e){}
}
function exportFile(){ try{ download("inventaire-sos-heli-" + today() + ".json", exportData(), "application/json"); toast("📤 Fichier JSON prêt — vérifie Téléchargements"); }catch(e){ toast("⚠️ Erreur export : " + (e && e.message ? e.message : e)); } }
function exportCsv(){ try{
  var head = ["SECTION","RÉF NNO/MAT","LIBELLÉ","TOTAL CHARGÉ"].concat(LOCS.map(function(l){ return l.k; }))
    .concat(["TOTAL RÉEL","ÉCART","DATE CONTRÔLE","OBSERVATION"]);
  function q(v){ return '"' + String(v==null?"":v).replace(/"/g,'""') + '"'; }
  var rows = [head.map(q).join(";")];
  state.items.forEach(function(it){
    var k = statutOf(it);
    rows.push([it.sec, it.nno||"", it.lib, it.d==null?"":it.d]
      .concat(it.loc.map(function(x){ return x==null?"":x; }))
      .concat([reelOf(it), ecartOf(it), it.dc||"", it.obs||""]).map(q).join(";"));
  });
  download("inventaire-unique-sos-heli-" + today() + ".csv", "\uFEFF" + rows.join("\r\n"), "text/csv");
  toast("📄 CSV exporté — ouvrable dans Excel");
  }catch(e){ toast("⚠️ Erreur export CSV : " + (e && e.message ? e.message : e)); }
}
function importFile(ev){
  var f = ev.target.files && ev.target.files[0]; if(!f) return;
  toast("📥 Fichier reçu : " + f.name);
  var r = new FileReader();
  r.onload = function(){ importJsonText(new TextDecoder().decode(r.result), true); };
  r.readAsText(f);
}
function importJsonText(txt, force){
  var data;
  try{ data = JSON.parse(txt); }catch(e){ toast("⚠️ Fichier illisible"); return false; }
  if(!data || !Array.isArray(data.items)){ toast("⚠️ Format inconnu"); return false; }
  if(!force && !window.confirm("Remplacer les " + state.items.length + " références actuelles par les " + data.items.length + " du fichier ?")) return false;
  try{ localStorage.setItem(KEY + "-secours", localStorage.getItem(KEY)); }catch(e){}
  /* on journalise l'import APRÈS avoir chargé le journal du fichier (ancien → nouveau) */
  var oldCount = state.items.length;
  state.items = data.items; state.tombs = data.tombs || {}; state.log = data.log || [];
  load.normalizeItems();
  primeShadow(); persist();
  logAdd("import", null, [["Références", oldCount, data.items.length]]);
  renderAll();
  toast("📥 " + data.items.length + " références importées");
  return true;
}
function initEvents(){
  E("q").addEventListener("input", function(){
    state.cfg.q = E("q").value; persist(); renderList();
  });
  E("q").value = state.cfg.q || "";
  E("secSel").addEventListener("change", function(){
    state.cfg.secFilter = E("secSel").value; persist(); renderList();
  });
  document.addEventListener("visibilitychange", function(){
    if(document.hidden && _dirty && driveCfgOk() && state.cfg.driveAuto) driveSend(false);
  });
}

/* ---------------- Google Drive ---------------- */
var _tok = null, _tokAt = 0;
function driveCfgOk(){ return !!(state.cfg.dCid && state.cfg.dRefresh); }
function driveToken(){
  if(_tok && (Date.now() - _tokAt) < 50*60000) return Promise.resolve(_tok);
  var body = "client_id=" + encodeURIComponent(state.cfg.dCid)
    + (state.cfg.dSecret ? "&client_secret=" + encodeURIComponent(state.cfg.dSecret) : "")
    + "&refresh_token=" + encodeURIComponent(state.cfg.dRefresh)
    + "&grant_type=refresh_token";
  return fetch("https://oauth2.googleapis.com/token", { method:"POST", headers:{ "Content-Type":"application/x-www-form-urlencoded" }, body:body })
    .then(function(r){ return r.json().then(function(j){
      if(!r.ok || !j.access_token) throw new Error(j.error_description || j.error || "token refusé");
      _tok = j.access_token; _tokAt = Date.now(); return _tok;
    }); });
}
function fetchTO(url, opts, ms){
  var ctl = new AbortController();
  var to = setTimeout(function(){ ctl.abort(); }, ms || 20000);
  var o = Object.assign({}, opts || {});
  o.signal = ctl.signal;
  return fetch(url, o).then(function(r){ clearTimeout(to); return r; }, function(e){ clearTimeout(to); throw e; });
}
function driveApi(path, opts){
  return driveToken().then(function(tok){
    var o = Object.assign({}, opts || {});
    o.headers = Object.assign({}, o.headers || {}, { Authorization:"Bearer " + tok });
    return fetchTO("https://www.googleapis.com/" + path, o);
  });
}
function driveFind(name, mime, parent){
  var q = "name='" + name.replace(/'/g,"\\'") + "' and mimeType='" + mime + "' and trashed=false"
    + (parent ? " and '" + parent + "' in parents" : "");
  return driveApi("drive/v3/files?q=" + encodeURIComponent(q) + "&fields=files(id,name)&pageSize=5")
    .then(function(r){ return r.json(); })
    .then(function(j){ return (j.files && j.files[0]) ? j.files[0].id : null; });
}
function driveCreateFolder(name){
  return driveApi("drive/v3/files?fields=id", { method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ name:name, mimeType:"application/vnd.google-apps.folder", fields:"id" }) })
    .then(function(r){ return r.json(); }).then(function(j){ if(!j.id) throw new Error("dossier non créé"); return j.id; });
}
function driveFolderId(){
  return driveFind(state.cfg.dFolder || "taffbmpm", "application/vnd.google-apps.folder")
    .then(function(id){ return id || driveCreateFolder(state.cfg.dFolder || "taffbmpm"); });
}
function driveFileId(folderId){
  return driveFind("sos-heli-inventaire.json", "application/json", folderId);
}
function driveDownload(fileId){
  return driveApi("drive/v3/files/" + fileId + "?alt=media").then(function(r){ return r.text(); });
}
function driveUploadCreate(folderId, text){
  var meta = JSON.stringify({ name:"sos-heli-inventaire.json", parents:[folderId] });
  var body = "--sosb\nContent-Type: application/json; charset=UTF-8\n\n" + meta + "\n--sosb\nContent-Type: application/json\n\n" + text + "\n--sosb--";
  return driveApi("upload/drive/v3/files?uploadType=multipart&fields=id", { method:"POST", headers:{ "Content-Type":"multipart/related; boundary=sosb" }, body:body })
    .then(function(r){ return r.json(); });
}
function driveUploadUpdate(fileId, text){
  return driveApi("upload/drive/v3/files/" + fileId + "?uploadType=media&fields=id", { method:"PATCH", headers:{ "Content-Type":"application/json" }, body:text })
    .then(function(r){ return r.json(); });
}
function driveSend(manual){
  if(!driveCfgOk()){
    if(manual) toast("⚙️ Configure le Drive dans les options ci-dessous");
    return Promise.resolve();
  }
  if(manual) toast("⏳ Sauvegarde Drive en cours…");
  if(driveSending){
    if(Date.now() - driveSendingAt < 120000){
      if(manual) toast("☁️ Envoi déjà en cours — celui-ci repartira juste après");
      _saveSeq++; _dirty = true; return Promise.resolve();
    }
    if(manual) toast("⚠️ Un envoi semblait bloqué — nouvelle tentative");
  }
  driveSending = true; driveSendingAt = Date.now();
  var seq0 = _saveSeq;
  var myLock = driveSendingAt;
  return driveFolderId()
    .then(function(fid){ return driveFileId(fid).then(function(fileId){
      var up = function(text){
        var f = fileId ? driveUploadUpdate(fileId, text) : driveUploadCreate(fid, text);
        return f.then(function(j){
          if(!j.id) throw new Error("upload refusé");
          state.driveSyncedAt = Date.now();
          _dirty = _saveSeq > seq0;
          persist(); renderPill(); renderBackupCard();
          if(manual) toast("☁️ Sauvegardé sur Drive" + (_dirty ? " (d'autres changements repartiront)" : ""));
        });
      };
      if(!fileId) return up(JSON.stringify({ v:1, app:"sos-heli-inventaire", items:state.items, tombs:state.tombs, log:state.log }));
      return driveDownload(fileId).then(function(txt){
        var remote = null;
        try{ remote = JSON.parse(txt); }catch(e){}
        var m = mergeRemote(remote);
        if(m.added || m.changed || m.removed){ persist(); renderAll(); }
        if(manual && (m.added || m.changed || m.removed))
          toast("☁️ Fusion : +" + m.added + " ~" + m.changed + " −" + m.removed);
        return up(JSON.stringify({ v:1, app:"sos-heli-inventaire", items:state.items, tombs:state.tombs, log:state.log }));
      }, function(){ return up(JSON.stringify({ v:1, app:"sos-heli-inventaire", items:state.items, tombs:state.tombs, log:state.log })); });
    }); })
    .catch(function(e){
      if(manual) toast("⚠️ Sauvegarde Drive impossible : " + (e && e.message ? e.message : "réseau"));
    })
    .then(function(){ if(driveSendingAt === myLock){ driveSending = false; } });
}
function driveRestore(){
  if(!driveCfgOk()){ toast("⚙️ Configure le Drive d'abord"); return; }
  driveFolderId().then(function(fid){
    return driveFileId(fid).then(function(fileId){
      if(!fileId) throw new Error("aucune sauvegarde trouvée");
      return driveDownload(fileId);
    });
  }).then(function(txt){
    importJsonText(txt, false);
  }).catch(function(e){ toast("⚠️ Restauration impossible : " + (e && e.message ? e.message : "réseau")); });
}
function saveDriveCfg(){
  state.cfg.dCid = E("dCid").value.trim();
  state.cfg.dSecret = E("dSecret").value.trim();
  state.cfg.dRefresh = E("dRefresh").value.trim();
  state.cfg.dFolder = E("dFolder").value.trim() || "taffbmpm";
  persist(); renderBackupCard();
  if(!driveCfgOk()){ toast("⚠️ Client ID et Refresh Token obligatoires"); return; }
  _tok = null; _tokAt = 0;
  driveSend(true);
}
function driveDisconnect(){
  state.cfg.dCid = ""; state.cfg.dSecret = ""; state.cfg.dRefresh = "";
  _tok = null; _tokAt = 0;
  persist(); renderBackupCard(); toast("🔌 Drive déconnecté");
}
function toggleAuto(){ state.cfg.driveAuto = E("dAuto").checked; persist(); }

/* ---------------- boot ---------------- */
load.normalizeItems = function(){
  state.items.forEach(function(it){
    if(!Array.isArray(it.loc)) it.loc = [];
    while(it.loc.length < LOCS.length) it.loc.push(null);
    if(!it.hist) it.hist = [];
  });
};
function boot(){
  load();
  renderLocGrid();
  initEvents();
  renderAll();
  if(driveCfgOk() && state.cfg.driveAuto) driveSend(false);
}
boot();
